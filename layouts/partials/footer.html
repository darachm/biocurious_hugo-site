<footer class="site-footer">
  <div class="footer-inner">

    <div class="footer-col footer-nav-col">
      <h4 class="footer-heading">Navigation</h4>
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" class="footer-nav-link">{{ .Name }}</a>
      {{ end }}
    </div>

    <div class="footer-col footer-contact-col">
      <h4 class="footer-heading">Contact</h4>
      <p>{{ site.Params.address }}</p>
      <p><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></p>
      <p><a href="{{ site.Params.meetup }}" target="_blank" rel="noopener">Join us on Meetup.com</a></p>
    </div>

    <div class="footer-col footer-map-col">
      <h4 class="footer-heading">Find Us</h4>
      <div class="footer-map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3169.7551844901795!2d-121.98615632346461!3d37.395621533908866!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fc9dae370b03f%3A0xb2f547f32a0f11f8!2s3108%20Patrick%20Henry%20Dr%2C%20Santa%20Clara%2C%20CA%2095054%2C%20USA!5e0!3m2!1sen!2sde!4v1776623263534!5m2!1sen!2sde"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>

  </div>
  <div class="footer-bottom">
    <p>© {{ now.Year }} BioCurious · Payments secured by Stripe</p>
  </div>
</footer>
