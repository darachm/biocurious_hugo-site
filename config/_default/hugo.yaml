title: "BioCurious"
timeZone: "America/Los_Angeles"
defaultContentLanguage: en
contentDir: content

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: "A community biology lab for amateurs, inventors, entrepreneurs, and anyone who wants to experiment with friends."
  address: "3108 Patrick Henry Drive, Santa Clara, CA 95054"
  email: "info@biocurious.org"
  meetup: "https://www.meetup.com/biocurious/events/"
  stripe_checkout: "/.netlify/functions/create-checkout"
  heroBanner:
    title: "Welcome to BioCurious"
    subtitle: "Located in Santa Clara, CA"
    slides:
      - image: "MainLab-2.jpg"
        alt: "BioCurious lab overview"
      - image: "Lecture_class-2.jpg"
        alt: "Lecture"
      - image: "Lecture class.JPG"
        alt: "Lecture"
      - image: "community-1.jpg"
        alt: "Community experiments in progress"
      - image: "TCLab-3a.jpg"
        alt: "Tissue Culture"
      - image: "Lab-8.jpg"
        alt: "Lab Work"
      - image: "Lab-6.jpg"
        alt: "Lab Work"
      - image: "Lab-4.JPG"
        alt: "Lab Work"
      - image: "NewHood.jpg"
        alt: "Community"
      # Add as many slides as you like. Images go in static/images/

  js_files:
    - 'static/functions/create-checkout.js'
    - 'static/functions/create-checkout_backup.js'
    - 'static/functions/get-session.js'
    - 'static/functions/package.json'
    - 'static/functions/stripe-webhook.js'

menus:
  main:
    - name: About
      url: /about/
      weight: 1
    - name: Projects
      url: /projects/
      weight: 2
    - name: Events
      url: /events/
      weight: 3
    - name: The Lab
      url: /lab/
      weight: 4
    - name: FAQ
      url: /faq/
      weight: 5
    - name: News
      url: /news/
      weight: 6
    - name: Membership
      url: /membership/
      weight: 7
    - name: Donations
      url: /donations/
      weight: 8
 
