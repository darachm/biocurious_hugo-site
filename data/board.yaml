- name: "Maria Chavez"
  title: "Board Member, President"
  photo: "maria.png"
  bio: "Over the past 6 years Maria has organized our events, classes and community projects. She is also a Board Member of Real Vegan Cheese, an open source project to create a synthetic cheese from genetically modified yeast. Maria is an adviser to the Latin American Network of BioHacker Spaces and has been a leader on two iGEM teams, in 2014 and 2015.  She is also a leading member of the Open Insulin Project and a cofounder of the Cuttlefish Project.  Her ambition is to continue to push open source science and to aid in the creation of more community biotech/science spaces available to everyone. Maria has a BS in Information Technology and an MBA focused in Global Management."

- name: "Jay Hanson"
  title: "Board Member, Chairman"
  photo: "jay.png"
  bio: "Jay worked in the consumer software industry for 30+ years including 5 startups and 2 successful IPOs.  His longest stints included VP Engineering at Visioneer (desktop scanners and image processing software) and Director of Operations in the Consumer Software Division at Apple.  After retiring from Apple, Jay got interested in molecular biology and joined BioCurious.  He is self-taught in biology having taken classes at BioCurious and online courses from MIT along with self-study. As a member of the BioCurious PlantBio project he built a low cost DIY gene gun for transfecting plants and published plans and usage instructions in the BioCoder Journal.  He also co-founded Berkeley BioLabs, an incubator for early stage biotech startups."
  
- name: "Joe Bamberg"
  title: "Board Member, Treasurer"
  photo: "Joe.png"
  bio: "Joe learned to make gunpowder from an encyclopedia reference at the age of 10. This started a search for recipes that ended with discovering he was good at organic chemistry. Joe then picked up a second degree in economics as it felt like science in the 1700's. He worked at Zoecon and helped develop weed and insect control by studying plant and insect hormones. He worked at Roche developing drugs for chronic and viral diseases. His experience at Burning Man revealed the importance of having communities surrounding Maker Spaces. Retiring has given him time to explore chocolate, go to film festivals and help out at BioCurious on chemistry related issues. Joe has been a board member since 2017."

- name: "Innokenti Toulokhonov, Ph.D."
  title: "Board Member"
  photo: "innokenti.png"
  bio: "Innokenti joined the BioCurious Board in 2017.  He is an expert in protein engineering and founded Amid Biosciences."

- name: "Eri Gentry"
  title: "Cofounder"
  photo: "Eri.jpg"
  bio: "Eri works toward the democratization and human-centricity of biology and medicine. Eri is also a science and technology researcher at the Institute for the Future, a Palo Alto-based futures research organization, where she helps organizations navigate the zones between technology disruption and user adoption. Eri sits on the board of Summer.org, a STEM education organization. She has been named a Champion for Change in Citizen Science by the White House, a Hometown Hero by Popular Mechanics, a Techonomy Top Ten (edging out additive manufacturing). She was previously cofounder and CEO of Livly, a biotech startup on a mission to cure major human diseases."

- name: "Eric Espinosa, Ph.D."
  title: "Advisory Board"
  photo: "Eric.jpg"
  bio: "Eric is an experienced scientist and entrepreneur. He is the founding scientist at three biotech companies and holds more than a dozen patents in next generation sequencing technologies and protein engineering. Dr. Espinosa has been published in top-tier journals such as Cell, Science, and Journal of Cell Biology. He was a scientist at Clontech Laboratories and TakaraBio, consults for early-stage life science companies, and leads the immortalized cuttlefish cell line project at BioCurious. Eric received his B.S. in Chemistry at Indiana University (2004) where he studied RNA structure and function. He then went to Stanford University where he earned his PhD in the Biochemistry Department (2011). He worked with Suzanne Pfeffer to understand the molecular mechanisms of vesicle trafficking."

- name: "Ulrike Pflückhahn, Ph.D."
  title: "Advisory Board"
  photo: "Ulli.jpg"
  bio: "Ulrike is a scientist with over 20 years of experience in cancer research. She leads the cell biology lab at BioCurious, is engaged in teaching young scientists and is the founder/CEO of Blossom BioScience.
  She researched at the University of Greifswald and University of Tuebingen, Germany and the University Southampton, UK. In her projects she investigated epigenetic changes in lymphoma and peptide vaccinations based on patient-specific tumor mutations. Ulrike earned her Ph.D in BioChemistry from the Free University Berlin where she identified novel hypoxia regulated genes in prostate cancer."